# ===========================================================================
# reluxe 차트 기본값
#
# 이 파일이 모든 템플릿의 기준이다. 여기서 정한 키 이름을 templates/ 가 참조한다.
# 환경별 차이는 values-vagrant.yaml · values-aws.yaml 이 이 값을 덮어쓴다.
#
# 규칙
#   - 여기에는 "모든 환경 공통" 또는 "안전한 기본값"만 둔다
#   - 환경마다 다른 값(이미지 주소, Ingress 등)은 빈 값으로 두고 환경 파일에서 채운다
#   - 🔴 비밀값은 절대 넣지 않는다. 이 파일은 git 에 커밋된다
# ===========================================================================

# ---------------------------------------------------------------------------
# 이름 재정의 (보통 건드리지 않는다)
#
# 릴리스 이름이 리소스 이름의 기준이 된다.
#   helm install reluxe ./charts/reluxe  →  reluxe-web, reluxe-config ...
# 이름을 강제로 바꾸고 싶을 때만 아래를 채운다.
# ---------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# 이미지
# ---------------------------------------------------------------------------
image:
  # 환경별로 반드시 덮어쓴다
  #   vagrant : 192.168.56.15:30500/reluxe-backend
  #   aws     : <계정>.dkr.ecr.ap-northeast-2.amazonaws.com/reluxe-backend
  repository: ""
  # Jenkins 가 커밋 해시 7자리로 갱신한다. 'latest' 를 쓰지 않는 이유는
  # 무엇이 떠 있는지 추적이 안 되고, pullPolicy 기본값이 Always 로 바뀌기 때문.
  tag: ""
  pullPolicy: IfNotPresent

# 크롤러는 별도 이미지(3.59GB, Chromium 포함)를 쓴다.
# repository 만 다르고 태그는 같은 커밋에서 나오므로 image.tag 를 공유한다.
crawlerImage:
  repository: ""

# 사설 레지스트리에 인증이 필요할 때만 사용 (Vagrant 는 insecure 라 불필요)
imagePullSecrets: []

# ---------------------------------------------------------------------------
# 웹 워크로드
# ---------------------------------------------------------------------------
replicaCount: 3

# 파드가 뜰 노드를 고른다. 노드에 label 을 걸어둔 상태여야 한다.
#   kubectl label node node1 workload=web
nodeSelector:
  workload: web

# 웹 파드는 taint 를 견딜 필요가 없다. 배치 노드로 가면 안 되기 때문.
tolerations: []

resources:
  # 🔴 requests 가 없으면 HPA 가 동작하지 않는다.
  #    HPA 는 "요청량 대비 사용량"으로 판단하는데 기준이 없어지기 때문.
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 무중단 배포
strategy:
  maxSurge: 1
  # 🔴 0 이어야 새 파드가 Ready 된 뒤에 옛 파드를 지운다.
  #    1 이면 배포 중 용량이 줄어 요청이 끊길 수 있다.
  maxUnavailable: 0

# 종료 시 진행 중이던 요청을 마저 처리할 시간
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 5

# AZ(노드) 분산
# 🔴 이걸 안 걸면 replicas 3 을 줘도 파드가 한 노드에 몰릴 수 있다.
#    그 노드가 죽으면 서비스가 전부 사라진다.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  # ScheduleAnyway = 분산이 안 되면 그래도 띄운다 (학습 단계에 안전)
  # DoNotSchedule  = 분산이 안 되면 Pending 으로 남긴다 (운영에 적합)
  whenUnsatisfiable: ScheduleAnyway

# 컨테이너 보안
# 이미지가 이미 uid 10001 비루트로 만들어져 있어(dockerfile.backend) 선언만 하면 된다.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # 임시파일 쓰기가 있으면 false. 확인 후 true 로
  capabilities:
    drop: ["ALL"]

# ---------------------------------------------------------------------------
# 헬스체크
#
# 🔴 두 경로의 역할이 다르다. 바꿔 쓰면 장애가 커진다.
#    /health  프로세스만 확인. DB 를 보지 않는다
#             → livenessProbe 와 ALB 헬스체크에 쓴다
#    /ready   DB 와 마이그레이션까지 확인
#             → readinessProbe 에만 쓴다
#
#    liveness 에 /ready 를 쓰면 DB 가 잠깐 죽었을 때
#    파드 3개가 전부 재시작 루프에 빠진다. 60초 장애가 몇 분짜리 전면 정지가 된다.
# ---------------------------------------------------------------------------
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Service / 외부 진입
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  # 컨테이너가 듣는 포트 (dockerfile.backend 의 EXPOSE 8000)
  targetPort: 8000

# Vagrant 는 ALB 가 없으므로 NodePort 로 외부에서 접속한다
nodeport:
  enabled: false
  port: 30080

# AWS 에서만 켠다. 켜면 AWS Load Balancer Controller 가 ALB 를 만든다
ingress:
  enabled: false
  className: alb
  host: ""
  certificateArn: ""
  annotations: {}

# ---------------------------------------------------------------------------
# 가용성
# ---------------------------------------------------------------------------
pdb:
  enabled: true
  # 노드 드레인 시 최소 몇 개를 남길지. replicas 3 에 2 면 한 번에 하나씩만 빠진다.
  minAvailable: 2

hpa:
  enabled: false          # Metrics Server 설치 후 켠다
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# 설정값 (ConfigMap 이 된다)
#
# 값은 전부 문자열로 쓴다. ConfigMap 의 data 는 문자열만 받는다.
# 숫자를 따옴표 없이 쓰면 Helm 이 렌더링할 때 오류가 난다.
#
# ⚠️ API_PREFIX 는 넣지 않는다.
#    config.py 에 API_PREFIX = "/api" 코드 상수로 박혀 있어 환경변수가 아니다.
#    ConfigMap 에 넣어도 앱이 읽지 않는다.
# ---------------------------------------------------------------------------
config:
  # 로그 — config.py 기본값은 text. 운영에서는 json 이 파싱하기 좋다
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # 크롤링 주기 — CronJob 이 따로 돌리므로 웹 파드에서는 꺼야 한다
  # 🔴 config.py 기본값이 True 라 명시적으로 false 를 넣어야 한다
  ENABLE_CRAWLER: "false"
  CRAWL_INTERVAL_MINUTES: "30"
  CRAWL_RETRY_MINUTES: "5"
  CRAWL_RUN_TIMEOUT_MINUTES: "60"
  JOONGNA_PAGES_PER_BRAND: "3"
  BUNJANG_PAGES_PER_JOB: "3"

  # 몇 번 연속 미발견이면 매물을 비활성 처리할지
  MISSING_THRESHOLD: "3"

  # 업로드 상한 5MB. nginx 를 뺐으므로 앱이 유일한 방어선이다
  MAX_UPLOAD_BYTES: "5242880"

  # 로그인 유지 12시간
  SESSION_MAX_AGE_SECONDS: "43200"

  # 🔴 비워둔다. 비어 있으면 CORS 미들웨어를 아예 붙이지 않는다.
  #    FastAPI 가 프론트를 같은 출처로 서빙하므로 필요 없다.
  ALLOWED_ORIGINS: ""

# ---------------------------------------------------------------------------
# 비밀값 (Secret)
#
# 🔴 값은 여기 쓰지 않는다. 이 파일은 git 에 커밋된다.
#
# Vagrant : 아래 명령으로 미리 만들고 create: false 로 둔다
#   kubectl create secret generic reluxe-secret -n reluxe \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#     --from-literal=DATABASE_RO_URL='postgresql+asyncpg://...' \
#     --from-literal=SESSION_SECRET="$(python3 -c 'import secrets;print(secrets.token_hex(32))')" \
#     --from-literal=ADMIN_USERNAME=admin --from-literal=ADMIN_PASSWORD='...' \
#     --from-literal=CLIENT_USERNAME=client --from-literal=CLIENT_PASSWORD='...'
#
# AWS : External Secrets Operator 가 Secrets Manager 에서 만든다
# ---------------------------------------------------------------------------
secret:
  # true 로 두면 차트가 Secret 을 만든다. 로컬 임시 테스트용이며 값이 git 에 남는다.
  create: false
  # 차트가 참조할 Secret 이름
  name: reluxe-secret
  # create: true 일 때만 쓰인다.
  # 🔴 여기에 실제 비밀번호를 넣고 커밋하지 말 것.
  #    값을 넣어야 한다면 --set 이나 별도 파일(-f)로 넘기고 그 파일은 .gitignore 에.
  data: {}

# ---------------------------------------------------------------------------
# 크롤러 CronJob (담당: B)
# ---------------------------------------------------------------------------
crawler:
  enabled: true
  schedule: "*/30 * * * *"
  # 🔴 컨테이너 기본 /dev/shm 은 64MB. Chromium 이 페이지를 열다 죽는다.
  #    docker-compose 의 shm_size: 1gb 에 해당한다.
  shmSize: 1Gi
  nodeSelector:
    workload: batch
  tolerations:
    - key: workload
      value: batch
      effect: NoSchedule
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# ---------------------------------------------------------------------------
# 집계 CronJob (담당: B)
# ⚠️ 앱에 클릭 집계 코드가 아직 없다. 진입점이 생긴 뒤 enabled: true 로 바꾼다.
# ---------------------------------------------------------------------------
aggregate:
  enabled: false
  schedule: "*/10 * * * *"

# ---------------------------------------------------------------------------
# pg_dump 백업 CronJob (담당: B)
# ⚠️ 진입점이 아직 없다.
# ---------------------------------------------------------------------------
pgdump:
  enabled: false
  schedule: "0 3 * * *"

# ---------------------------------------------------------------------------
# 마이그레이션 Job (담당: B)
#
# 백엔드 이미지를 그대로 쓴다. dockerfile.backend 에 alembic.ini 와 alembic/ 이
# 이미 들어 있어 별도 이미지가 필요 없다.
#
# Helm 훅(pre-install, pre-upgrade)으로 앱 파드보다 먼저 실행된다.
# 웹 파드 3개가 동시에 alembic 을 돌리면 경합하기 때문.
# ---------------------------------------------------------------------------
migrate:
  enabled: true
  backoffLimit: 2
