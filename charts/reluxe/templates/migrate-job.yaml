{{/*
===========================================================================
DB 마이그레이션 Job — alembic upgrade head

Helm 훅으로 앱 파드보다 먼저 실행된다.
웹 파드 3개가 동시에 alembic 을 돌리면 경합하기 때문이다.

백엔드 이미지를 그대로 쓴다.
dockerfile.backend 에 alembic.ini 와 alembic/ 이 이미 들어 있다.
===========================================================================
*/}}
{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  {{/* 리비전을 붙여 업그레이드마다 새 Job 이 되게 한다 */}}
  name: {{ include "reluxe.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "reluxe.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    {{/* 음수일수록 먼저. 다른 훅이 생겨도 마이그레이션이 앞서게 -5 로 둔다 */}}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "reluxe.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "reluxe.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            {{- include "reluxe.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
