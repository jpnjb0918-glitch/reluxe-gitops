replicaCount: 1

image:
  repository: reluxe-web
  tag: latest
  pullPolicy: IfNotPresent

crawlerImage:
  repository: reluxe-crawler

nodeport:
  enabled: true
  port: 30080

ingress:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

topologySpread:
  enabled: false

service:
  type: NodePort
  port: 8000
  targetPort: 8000

secret:
  create: false

config:
  LOG_LEVEL: "DEBUG"
  ENVIRONMENT: "vagrant"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

crawler:
  enabled: true
  schedule: "0 */6 * * *"
  command: ["python", "-m", "crawler.main"]
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

aggregate:
  enabled: true
  schedule: "0 2 * * *"
  command: ["python", "-m", "app.aggregate"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

migrate:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

backup:
  enabled: false