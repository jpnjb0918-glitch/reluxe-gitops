# ---------------------------------------------------------------------------
# 설정값 통 (비밀이 아닌 것)
#
# values.yaml 의 config 블록이 그대로 환경변수가 된다.
# 웹·크롤러·집계·마이그레이션 파드가 envFrom 으로 통째로 가져다 쓴다.
#
# 값을 바꾸려면 values 만 고치고 helm upgrade 하면 된다.
# 이미지를 다시 빌드할 필요가 없다 — 크롤러가 3.59GB 라 이게 중요하다.
#
# ⚠️ ConfigMap 의 data 는 문자열만 받는다.
#    values 에서 따옴표 없이 숫자를 쓰면 여기서 렌더링 오류가 난다.
#    quote 를 붙여 강제로 문자열로 만든다.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reluxe.configMapName" . }}
  labels:
    {{- include "reluxe.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
