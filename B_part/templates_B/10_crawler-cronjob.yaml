{{/*
===========================================================================
크롤러 CronJob — 주기적 데이터 수집 배치 워크로드
===========================================================================
*/}}
{{- if .Values.crawler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "reluxe.fullname" . }}-crawler
  labels:
    {{- include "reluxe.labels" . | nindent 4 }}
    app.kubernetes.io/component: crawler
spec:
  schedule: {{ .Values.crawler.schedule | quote }}
  concurrencyPolicy: {{ .Values.crawler.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.crawler.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.crawler.failedJobsHistoryLimit | default 1 }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "reluxe.labels" . | nindent 12 }}
            app.kubernetes.io/component: crawler
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.crawler.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.crawler.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: crawler
              image: {{ include "reluxe.crawlerImage" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: {{ toYaml .Values.crawler.command | nindent 16 }}
              envFrom:
                {{- include "reluxe.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.crawler.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
{{- end }}