# ---------------------------------------------------------------------------
# helm-values/jenkins.yaml — jenkins/jenkins 차트 설치용 값
#
#   helm repo add jenkins https://charts.jenkins.io
#   helm install jenkins jenkins/jenkins -n infra -f helm-values/jenkins.yaml
#
# node5에 컨트롤러가 뜨고, 빌드마다 에이전트 파드가 떴다 사라진다. (④ 문서 0-B, 8장)
# node5 RAM 예산 중 Jenkins 몫은 4GB.
# AWS 이관 시: storageClassName만 gp3로 바뀜. (🟢)
#
# 🔴 이미지 빌드는 Buildah로 한다 — k3s는 containerd라 Docker 데몬이 없다.
#    Kaniko는 2025년 6월 아카이브됨. (④ 문서 7장)
# ---------------------------------------------------------------------------

controller:
  nodeSelector:
    workload: infra

  serviceType: NodePort
  servicePort: 8080
  nodePort: 30808

  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }

  javaOpts: "-Xms512m -Xmx1536m"

  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

  # 파이프라인이 필요로 하는 플러그인
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - pipeline-stage-view:latest

  # CloudeDX 저장소를 폴링/웹훅으로 감시하는 Job은 JCasC로 등록 가능하지만
  # 최초엔 Jenkins UI에서 Multibranch Pipeline으로 직접 만드는 걸 권장 (문서에 없어 팀 확인 필요)

# 빌드 실행용 에이전트 파드 템플릿 (Buildah)
agent:
  enabled: false   # Kubernetes 플러그인이 podTemplates로 동적 생성하므로 기본 agent는 끔

  podTemplates:
    # -----------------------------------------------------------------------
    # 빌드 에이전트 — 컨테이너를 역할별로 나눈다.
    #
    # 🔴 한 컨테이너에 전부 넣지 않는 이유
    #    buildah 이미지에는 uv·helm·git 이 없다. 파이프라인이 그것들을 쓰면
    #    "command not found" 로 죽는다. Jenkins Kubernetes 플러그인은
    #    container('이름') 블록으로 단계마다 다른 컨테이너를 고를 수 있다.
    # -----------------------------------------------------------------------
    build: |
      - name: build
        label: build
        nodeSelector: "workload=batch"   # 빌드는 배치 노드(node4)에서
        # 🔴 node4 는 workload=batch:NoSchedule taint 가 걸려 있다.
        #    toleration 없이는 파드가 Pending 에서 멈춘다.
        yamlMergeStrategy: override
        yaml: |
          spec:
            tolerations:
              - key: "workload"
                operator: "Equal"
                value: "batch"
                effect: "NoSchedule"
            volumes:
              # buildah 가 이미지 레이어를 푸는 공간.
              # 크롤러 이미지가 3.59GB 라 컨테이너 기본 저장소로는 부족하다.
              - name: buildah-storage
                emptyDir: {}
        containers:
          # --- 파이썬 lint/test 용 -------------------------------------------
          - name: python
            # 앱과 같은 3.13 을 쓴다. uv 는 파이프라인 첫 줄에서 설치한다.
            image: python:3.13-slim
            command: "sleep"
            args: "99d"
            resourceRequestCpu: "500m"
            resourceRequestMemory: "1Gi"
            resourceLimitCpu: "2"
            resourceLimitMemory: "2Gi"

          # --- 이미지 빌드용 -------------------------------------------------
          - name: buildah
            image: quay.io/buildah/stable:latest
            command: "sleep"
            args: "99d"
            # 🔴 rootless 빌드에도 특별 권한이 필요하다.
            #    node4 가 배치 전용이라 웹 파드에는 영향이 없다.
            privileged: true
            resourceRequestCpu: "1"
            resourceRequestMemory: "2Gi"
            resourceLimitCpu: "2"
            # 크롤러 이미지 3.59GB 빌드를 감안한 여유
            resourceLimitMemory: "4Gi"

          # --- helm lint/template · git 커밋용 --------------------------------
          - name: tools
            # ⚠️ Alpine 기반이라 git 이 기본 포함되지 않는다.
            #    Jenkinsfile 에서 apk add --no-cache git 으로 설치한다.
            #    (ENTRYPOINT 가 helm 이므로 command: sleep 으로 덮어써야 sh 가 돈다)
            image: alpine/helm:3.16.3
            command: "sleep"
            args: "99d"
            resourceRequestCpu: "200m"
            resourceRequestMemory: "512Mi"

rbac:
  create: true

serviceAccount:
  create: true
  name: jenkins
