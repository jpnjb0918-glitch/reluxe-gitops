global: 
  nodeSelector:
    workload: infra
  tolerations: 
    - key: workload 
      operator: Equal 
      value: infra 
      effect: NoSchedule

# ?먯껜 ?쒕챸 ?몄쬆?쒕씪 --insecure ?꾩슂 (?ъ꽕 ?꾨찓?? ACM ?놁쓬)
configs: params:
    server.insecure: true

  # ?뵶 reverdi-gitops媛 private repo?쇰㈃ ?ш린???깅줉?댁빞 Argo CD媛 ?쎌쓣 ???덈떎. 
  #    ?좏겙? ?ш린 而ㅻ컠?섏? ?딅뒗????configs.credentialTemplates ??? 
  #    Secret??蹂꾨룄濡?留뚮뱾怨??꾨옒泥섎읆 repositories留??깅줉?쒕떎.
  #      kubectl create secret generic reverdi-gitops-creds -n argocd \ 
  #        --from-literal=type=git \ 
  #        --from-literal=url=https://github.com/jpnjb0918-glitch/reverdi-gitops.git \ 
  #        --from-literal=password=<github-token> \ --from-literal=username=<github-id>
