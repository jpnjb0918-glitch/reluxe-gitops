global:
  nodeSelector:
    workload: infra
  tolerations:
    - key: workload
      operator: Equal
      value: infra
      effect: NoSchedule

configs:
  params:
    server.insecure: true

redis-ha:
  enabled: false

controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

server:
  replicas: 1
  service:
    type: NodePort
    nodePortHttp: 30081
    nodePortHttps: 30443
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

repoServer:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 512Mi }

applicationSet:
  enabled: false
notifications:
  enabled: false
