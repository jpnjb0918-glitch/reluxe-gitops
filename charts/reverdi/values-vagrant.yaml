# ===========================================================================
# Vagrant (로컬 k3s) 전용 값
#
#   helm upgrade --install reverdi charts/reverdi -n reverdi -f charts/reverdi/values-vagrant.yaml
#
# values.yaml 을 덮어쓴다. 여기 없는 항목은 values.yaml 값을 그대로 쓴다.
# ===========================================================================

# ---------------------------------------------------------------------------
# 이미지 — 사설 레지스트리 (C 가 node5 에 registry:2 로 띄운다)
# ⚠️ 앱 이미지는 reverdi-backend 다. reverdi-web 은 nginx 이미지라 다르다.
# ---------------------------------------------------------------------------
image:
  repository: 192.168.56.15:30500/reverdi-backend
  tag: dev
  pullPolicy: IfNotPresent

crawlerImage:
  repository: 192.168.56.15:30500/reverdi-crawler

# ---------------------------------------------------------------------------
# 외부 접근 — 로컬엔 ALB 가 없으므로 NodePort 로 연다
#   http://192.168.56.11:30080
# ---------------------------------------------------------------------------
nodeport:
  enabled: true
  port: 30080

ingress:
  enabled: false

# ---------------------------------------------------------------------------
# 규모
# 노드가 3대 이상이면 replicaCount 3 + topologySpread 로 분산을 검증한다.
# VM 을 1대만 띄운다면 replicaCount 1, topologySpread false 로 낮춘다.
# ---------------------------------------------------------------------------
replicaCount: 4

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname   # 로컬엔 AZ 라벨이 없으므로 호스트명으로
  whenUnsatisfiable: DoNotSchedule   # 분산 실패를 조용히 넘기지 않는다

pdb:
  enabled: true
  minAvailable: 2

hpa:
  enabled: false        # Metrics Server 설치 후 true 로

# ---------------------------------------------------------------------------
# 자원 — 로컬 VM 은 여유가 적으므로 낮춘다
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------------------------------------------------------------------------
# 설정
# ---------------------------------------------------------------------------
config:
  LOG_LEVEL: "DEBUG"
  LOG_FORMAT: "text"        # 로컬에선 사람이 읽기 좋게
  ENABLE_CRAWLER: "false"   # 크롤링은 CronJob 담당
  ALLOWED_ORIGINS: ""

  # 🔴 local 로 둔다. production 이면 config.py 가 기동 가드를 켜서
  #    S3_BUCKET 이 비어 있을 때 프로세스가 죽는다.
  APP_ENV: "local"
  COOKIE_SECURE: "false"    # 로컬은 HTTP

  # 로컬엔 S3 가 없으므로 디스크 저장을 허용한다
  ALLOW_LOCAL_STORAGE: "true"
  S3_BUCKET: ""
  # 🔴 NodePort 로 직접 들어온다 — 앞에 프록시가 없다.
  #    켜면 누구나 X-Forwarded-For 에 아무 IP 나 적어 속도 제한을 피할 수 있다.
  TRUST_PROXY_HEADERS: "false"

  # CloudNativePG 가 TLS 인증서를 자동 생성하지만,
  # 로컬에서 인증서 검증까지 할 이유는 없다.
  DATABASE_SSL_MODE: "prefer"

# 🔴 Secret 은 미리 만들어 둔다 (README 참조). 차트는 참조만 한다.
secret:
  create: false
  name: reverdi-secret

# ---------------------------------------------------------------------------
# 배치
# ---------------------------------------------------------------------------
crawler:
  enabled: true
  # 로컬에서는 자주 돌 필요가 없다. 동작 확인만 하고 수동 실행이 편하다.
  #   kubectl create job --from=cronjob/reverdi-crawler manual-1 -n reverdi
  schedule: "0 */6 * * *"

aggregate:
  enabled: false    # app/aggregate 모듈 미구현

pgdump:
  enabled: false    # MinIO 업로드 미구현
