      url: https://github.com/jpnjb0918-glitch/reverdi-gitops.git type: git

# 由ъ냼?ㅺ? 鍮좊벏??node5??HA 援ъ꽦? ??(?뚯뒪???④퀎)
redis-ha: enabled: false

controller: replicas: 1 resources:
    requests: { cpu: 100m, memory: 256Mi } limits: { cpu: 500m, memory: 512Mi }

server: replicas: 1 service:
    type: NodePort nodePortHttp: 30080 nodePortHttps: 30443
  resources: requests: { cpu: 50m, memory: 128Mi } limits: { cpu: 300m, memory: 256Mi }

repoServer: replicas: 1 resources:
    requests: { cpu: 50m, memory: 128Mi } limits: { cpu: 300m, memory: 512Mi }

applicationSet: enabled: false # 吏湲덉? Application 1媛쒕퓧?대씪 遺덊븘??

