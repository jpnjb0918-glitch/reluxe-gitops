apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: reverdi-db
  namespace: reverdi
spec:
  instances: 3   # primary 1 + replica 2 ??node1~3???섎굹??
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  primaryUpdateStrategy: unsupervised   # ?뚯뒪???④퀎. ?댁쁺 ?꾪솚 ??supervised ?ш???
  storage:
    size: 10Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: reverdi
      owner: reverdi
      # ?뵶 鍮꾨?踰덊샇瑜??ш린 ?곸? ?딅뒗??
      #    ???대쫫???쒗겕由우씠 ?놁쑝硫?CNPG媛 ?먮룞 ?앹꽦?쒕떎 (username/password ??.
      #    媛믪? ?꾨옒 紐낅졊?쇰줈 爰쇰궡?? A?대떦 README??      #    "kubectl create secret ... DATABASE_URL=postgresql+asyncpg://reverdi:PW@..." ??      #    PW ?먮━???ｌ뼱以??
      #      kubectl get secret reverdi-db-app -n reverdi -o jsonpath='{.data.password}' | base64 -d
      secret:
        name: reverdi-db-app

  # DB ?뚮뱶?????뚮뱶? 媛숈? ?몃뱶援?node1~3)?먮쭔 ?④쾶 ?쒕떎. (??臾몄꽌 0-B)
  # ?ъ쟾 ?묒뾽: kubectl label node node1 node2 node3 workload=web
  affinity:
    nodeSelector:
      workload: web
    # primary/replica瑜??쒕줈 ?ㅻⅨ ?몃뱶濡?遺꾩궛 (湲곕낯 preferred)
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    # ?좑툘 AWS?먯꽌??topologyKey瑜?topology.kubernetes.io/zone(AZ)?쇰줈 諛붽씔??
    #    Vagrant???몃뱶??AZ ?쇰꺼???놁쑝誘濡??몄뒪???⑥쐞濡??泥댄뻽??
    #    ?ㅼ젣 AZ 遺꾩궛???ш린?쒕룄 寃利앺븯怨??띕떎硫?node1~3??    #    topology.kubernetes.io/zone=az-a/b/c ?쇰꺼???섎룞?쇰줈 嫄멸퀬
    #    ??媛믪쓣 留욎떠 ?곕㈃ ?쒕떎 ????遺遺꾩? ? ?뚯쓽?먯꽌 ?뺥븯??寃?醫뗪쿋??

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  monitoring:
    enablePodMonitor: false   # kube-prometheus-stack ?ㅼ튂 ??true濡??꾪솚

