replicaCount: 3

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/reluxe-web
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

crawlerImage:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/reluxe-crawler

nodeport:
  enabled: false

ingress:
  enabled: true
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  certificateArn: "arn:aws:acm:<AWS_REGION>:<AWS_ACCOUNT_ID>:certificate/<CERT_ID>"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

strategy:
  maxSurge: 1
  maxUnavailable: 0

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

secret:
  create: false

config:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

securityContext:
  runAsUser: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

crawler:
  enabled: true
  schedule: "0 */3 * * *"
  command: ["python", "-m", "crawler.main"]
  nodeSelector:
    workload: batch
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "batch"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

aggregate:
  enabled: true
  schedule: "0 3 * * *"
  command: ["python", "-m", "app.aggregate"]
  resources:
    requests:
      cpu: 200m
      memory: 256Mi

migrate:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi

backup:
  enabled: true
  schedule: "0 4 * * *"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi