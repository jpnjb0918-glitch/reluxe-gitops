{{/*
===========================================================================
Ingress — 외부 요청을 웹 Service로

🔴 Vagrant에서는 쓰지 않는다 (ingress.enabled: false).
   로컬에는 Ingress Controller가 없다. k3s 기본 Traefik은 --disable=traefik으로 껐고,
   EKS에는 없는 것이 로컬에만 있으면 나중에 동작이 달라 헷갈리기 때문이다.
   대신 NodePort로 접근한다.

AWS에서는 enabled: true로 켠다. 그러면 AWS Load Balancer Controller가
이 선언을 보고 ALB를 실제로 만든다. Ingress 자체는 선언일 뿐이고,
컨트롤러를 Helm으로 설치하지 않으면 아무 일도 일어나지 않는다.
===========================================================================
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "reverdi.fullname" . }}-web
  labels:
    {{- include "reverdi.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    {{/*
      ALB 동작은 전부 annotation으로 지정한다.
      아래는 values-aws.yaml에서 넘기고, 여기서는 기본값만 둔다.

      대표적인 것
        scheme: internet-facing        인터넷에서 접근 가능
        target-type: ip                파드 IP로 직접 분산 (VPC CNI라 가능)
        healthcheck-path: /health      🔴 /ready가 아니다. DB 장애 시 전 파드 제외 방지
        listen-ports / ssl-redirect    80 → 443 강제
        certificate-arn                ACM 인증서
    */}}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{/*
      host를 비워두면 모든 호스트 이름을 받는다.
      도메인이 정해지기 전에도 ALB DNS로 접속해 확인할 수 있다.

      ⚠️ host 줄을 조건부로 넣을 때 '- {{- if }}' 형태로 쓰면
         host가 있을 때 들여쓰기가 깨진다. 아래처럼 항목 전체를 분기한다.
    */}}
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "reverdi.fullname" . }}-web
                port:
                  number: {{ .Values.service.port }}
    {{- else }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "reverdi.fullname" . }}-web
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
{{- end }}
