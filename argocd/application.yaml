# argocd/application.yaml ??Argo CD?먭쾶 "reverdi 李⑦듃瑜????대윭?ㅽ꽣??留욎떠??
#
# reverdi-gitops ??μ냼(A/B媛 ?щ┛ charts/reverdi/)瑜???由ъ냼???섎굹媛 媛먯떆?쒕떎.
# ?댄썑濡쒕뒗 kubectl apply瑜??곗? ?딅뒗????git 而ㅻ컠 ??Argo CD ?숆린?붾줈留?諛고룷?쒕떎.
# (??臾몄꽌 0-D: "10踰??댄썑濡쒕뒗 kubectl apply瑜??곗? ?딆뒿?덈떎")
#
# AWS ?닿? ??諛붾뚮뒗 嫄?valueFiles ??以꾨퓧. (??臾몄꽌 7??
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reverdi
  namespace: argocd
spec:
  project: default

  source:
    # ?뵶 ?ㅼ젣 議곗쭅/怨꾩젙??留욊쾶 ?뺤씤 ?꾩슂. A/B媛 ?곕뒗 ??μ냼 二쇱냼.
    repoURL: https://github.com/jpnjb0918-glitch/reverdi.git
    targetRevision: main
    path: charts/reverdi
    helm:
      valueFiles:
        - values-vagrant.yaml   # ?뵶 AWS?먯꽌??values-aws.yaml濡?????以꾨쭔 援먯껜

  destination:
    server: https://kubernetes.default.svc
    namespace: reverdi

  syncPolicy:
    automated:
      prune: true       # git?먯꽌 吏??由ъ냼?ㅻ뒗 ?대윭?ㅽ꽣?먯꽌????젣
      selfHeal: true     # kubectl edit?쇰줈 ?먮?硫?Argo CD媛 ?섎룎由?
    syncOptions:
      - CreateNamespace=true   # reverdi ?ㅼ엫?ㅽ럹?댁뒪 ?놁쑝硫??먮룞 ?앹꽦
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

