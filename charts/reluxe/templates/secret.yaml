# ---------------------------------------------------------------------------
# 비밀값 통
#
# 🔴 기본은 create: false 다. 차트가 Secret 을 만들지 않고 이름만 참조한다.
#    values.yaml 은 git 에 커밋되므로 비밀번호를 넣으면 그대로 노출된다.
#
# Vagrant — 미리 만들어 둔다
#   kubectl create secret generic reluxe-secret -n reluxe \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://reluxe:PW@reluxe-db-rw.reluxe.svc:5432/reluxe' \
#     --from-literal=DATABASE_RO_URL='postgresql+asyncpg://reluxe:PW@reluxe-db-ro.reluxe.svc:5432/reluxe' \
#     --from-literal=SESSION_SECRET="$(python3 -c 'import secrets;print(secrets.token_hex(32))')" \
#     --from-literal=ADMIN_USERNAME=admin \
#     --from-literal=ADMIN_PASSWORD='...' \
#     --from-literal=CLIENT_USERNAME=client \
#     --from-literal=CLIENT_PASSWORD='...'
#
# AWS — External Secrets Operator 가 Secrets Manager 에서 만든다
#
# 🔴 SESSION_SECRET 을 반드시 주입해야 한다.
#    미설정이면 config.py 가 파드마다 랜덤 값을 만든다(secrets.token_hex(32)).
#    replicas 3 이면 세 파드가 서로의 쿠키를 인정하지 않아 로그인이 동작하지 않는다.
#    보안 문제이기 전에 기능이 깨지는 문제다.
#
# ⚠️ DATABASE_RO_URL 은 앱이 아직 읽지 않는다(백엔드 수정요청 1번).
#    넣어두어도 무시되므로, 앱 수정이 끝난 뒤에 의미가 생긴다.
# ---------------------------------------------------------------------------
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reluxe.secretName" . }}
  annotations:
    {{/*
      create: true 로 차트가 Secret 을 만들 때는, migrate-job(pre-install 훅)보다
      먼저 생성되어야 한다. weight 를 -10 으로 두어 -5 인 migrate 보다 앞세운다.
      (기본값 create: false 에서는 이 블록이 렌더링되지 않는다)
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "reluxe.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
