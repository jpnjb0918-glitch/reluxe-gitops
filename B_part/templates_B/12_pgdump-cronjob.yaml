{{/*
===========================================================================
DB 백업 CronJob — pg_dump 주기적 실행
===========================================================================
*/}}
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "reluxe.fullname" . }}-pgdump
  labels:
    {{- include "reluxe.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy | default "Forbid" }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "reluxe.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: {{ .Values.backup.image | default "postgres:15-alpine" }}
              command:
                - /bin/sh
                - -c
                - pg_dump "$DATABASE_URL" | gzip > /backup/backup-$(date +\%Y\%m\%d\%H\%M\%S).sql.gz
              envFrom:
                {{- include "reluxe.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
{{- end }}